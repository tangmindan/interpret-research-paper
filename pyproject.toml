[project]
name = "interpret-research-paper-skill"
version = "1.0.1"
description = "Chinese-first evidence-grounded research-paper interpretation Agent Skill"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["Pillow>=10", "PyMuPDF>=1.24"]

[project.optional-dependencies]
dev = ["jsonschema>=4.21"]

[tool.ruff]
line-length = 120
target-version = "py310"
